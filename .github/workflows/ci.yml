# Checks de cada PR (CONTRIBUTING §8). OpenSpec y la versión prevista siempre están activos.
# Los checks del stack se activan descomentando su bloque (el walking skeleton lo hace):
# ajusta la carpeta, quita las líneas que no uses y añade el resto como pasos `run`.
name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all --no-interactive

  # Comenta en el PR el tag beta que creará al mergear y por qué (CONTRIBUTING §9).
  version:
    name: Versión prevista
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          source .github/scripts/version.sh
          next_beta
          if [ -n "$tag" ]; then
            body="**Versión prevista al mergear:** \`$tag\`"$'\n\n'"Motivo: $reason"
          else
            body="**Versión prevista al mergear:** sin tag; no hay commits \`feat\`, \`fix\`, \`perf\` ni incompatibles."
          fi
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"

